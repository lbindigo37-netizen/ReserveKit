kind = "web"
previewPath = "/"
title = "ReserveKit"
description = "A premium white-label booking platform starter for local businesses, with a public booking experience and configurable customer and admin workspaces."
version = "1.0.0"
id = "artifacts/reservekit"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20123

[services.development]
run = "pnpm --filter @workspace/reservekit run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reservekit", "run", "build" ]
serve = "static"
publicDir = "artifacts/reservekit/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20123"
BASE_PATH = "/"
